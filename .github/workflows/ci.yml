name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
          POSTGRES_DB: bankdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bankuser -d bankdb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://bankuser:bankpass@localhost:5432/bankdb_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # -coverpkg counts code exercised by test/integration too.
      - name: Test
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose --profile observability up -d --build --wait
        env:
          VERSION: ci-${{ github.sha }}

      - name: Smoke test
        run: |
          set -euo pipefail
          api=http://localhost:8080

          curl -fsS $api/health/live
          curl -fsS $api/health/ready

          customer=$(curl -fsS -X POST $api/api/customers \
            -d '{"full_name":"CI","email":"ci@example.com","cpf":"52998224725","birth_date":"1990-01-01"}' | jq -r .data.id)
          account=$(curl -fsS -X POST $api/api/accounts \
            -d "{\"customer_id\":\"$customer\",\"type\":\"checking\"}" | jq -r .data.id)
          curl -fsS -X POST $api/api/accounts/$account/deposits -d '{"amount":1000}'

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST $api/api/accounts/$account/withdrawals -d '{"amount":5000}')
          test "$status" = 422

          request_id=$(curl -fsS -D - -o /dev/null -H 'X-Request-ID: ci-trace-1' $api/api/accounts/$account | grep -i '^x-request-id' | tr -d '\r' | cut -d' ' -f2)
          test "$request_id" = ci-trace-1
          docker compose logs app | grep '"request_id":"ci-trace-1"'

          curl -fsS $api/metrics | grep 'bank_operations_total{operation="withdrawal",result="INSUFFICIENT_BALANCE"} 1'
          curl -fsS $api/metrics | grep "bank_build_info{go_version=\"go.*\",version=\"ci-${GITHUB_SHA}\"} 1"

          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22bank-api%22%7D' | grep '"value":\[[0-9.]*,"1"\]'
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -u admin:admin http://localhost:3000/api/dashboards/uid/bank-api | jq -e '.dashboard.title == "Bank API"'

      - name: Graceful shutdown
        run: |
          docker compose stop app
          docker compose logs app | grep '"msg":"server stopped"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs
